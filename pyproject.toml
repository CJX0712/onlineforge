[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onlineforge"
version = "0.1.0"
description = "OnlineForge — 流式/增量学习系统（river + scikit-learn + 纯 numpy 兜底），作者晨星"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "晨星" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.9",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
sota = ["river>=0.15"]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["onlineforge*"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q -W ignore::UserWarning"

[tool.ruff]
line-length = 96
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
